---
- name: Deploy Docker Compose application with monitoring stack
  hosts: all
  become: yes
  vars_files:
    - ../../vault.yml
  tasks:
    - name: Ensure Docker and Docker Compose are installed
      apt:
        namekk:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes

    - name: Ensure secrets directory exists
      file:
        path: /opt/pet-project/secrets
        state: directory
        mode: '0700'

    - name: Create Slack webhook URL file from Vault
      copy:
        content: "{{ vault_slack_webhook_url }}"
        dest: /opt/pet-project/secrets/slack_webhook_url
        mode: '0640'
        owner: '65534'
        group: '65534'

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory
      file:
        path: /opt/pet-project
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml to target
      copy:
        src: ../../docker-compose.yml
        dest: /opt/pet-project/docker-compose.yml
        mode: '0644'

    - name: Copy prometheus.yml to target
      copy:
        src: ../../prometheus.yml
        dest: /opt/pet-project/prometheus.yml
        mode: '0644'

    - name: Ensure no file or directory exists at process-exporter.yml path
      file:
        path: /opt/pet-project/process-exporter.yml
        state: absent

    - name: Copy process-exporter.yml to target
      copy:
        src: ../../process-exporter.yml
        dest: /opt/pet-project/process-exporter.yml
        mode: '0644'

    - name: Copy alertmanager.yml to target
      copy:
        src: ../../alertmanager.yml
        dest: /opt/pet-project/alertmanager.yml
        mode: '0644'

    - name: Ensure no file or directory exists at Alerts.yml path
      file:
        path: /opt/pet-project/Alerts.yml
        state: absent

    - name: Copy Alerts.yml to target
      copy:
        src: ../../Alerts.yml
        dest: /opt/pet-project/Alerts.yml
        mode: '0644'

    - name: Copy loki-config.yml to target
      copy:
        src: ../../loki-config.yml
        dest: /opt/pet-project/loki-config.yml
        mode: '0644'

    - name: Copy promtail-config.yml to target
      copy:
        src: ../../promtail-config.yml
        dest: /opt/pet-project/promtail-config.yml
        mode: '0644'

    - name: Copy Grafana provisioning directory
      copy:
        src: ../../grafana-provisioning/
        dest: /opt/pet-project/grafana-provisioning/
        mode: '0755'

    - name: Copy loki-rules.yml to target
      copy:
        src: ../../loki-alerts.yml
        dest: /opt/pet-project/loki-alerts.yml
        mode: '0644'

    - name: Copy tempo-config.yml to target
      copy:
        src: ../../tempo-config.yml
        dest: /opt/pet-project/tempo-config.yml
        mode: '0644'

    - name: Remove orphaned containers
      command: docker-compose down --remove-orphans
      args:
        chdir: /opt/pet-project
      ignore_errors: yes

    - name: Run docker-compose up
      docker_compose:
        project_src: /opt/pet-project
        state: present
        restarted: yes
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'process_exporter'
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['process_exporter:9256']

  - job_name: 'cadvisor'
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'alertmanager'
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets: ['alertmanager:9093']
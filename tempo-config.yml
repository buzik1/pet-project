# Минимальная конфигурация для single‑ноды
stream_over_http_enabled: true

server:
  http_listen_port: 3200          # порт для API и запросов от Grafana

distributor:
  receivers:
    otlp:                          # принимаем трейсы по OpenTelemetry Protocol
      protocols:
        http:
          endpoint: 0.0.0.0:4318   # HTTP‑порт для OTLP/HTTP
        grpc:
          endpoint: 0.0.0.0:4317   # gRPC‑порт для OTLP/gRPC

ingester:
  max_block_duration: 5m           # максимальная длительность блока перед сбросом на диск

compactor:
  compaction:
    block_retention: 24h           # храним трейсы 48 часов

storage:
  trace:
    backend: local                 # используем локальную файловую систему
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

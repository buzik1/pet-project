groups:
  - name: loki_alerts
    rules:
      - alert: HighErrorRate
        expr: sum by (container) (count_over_time({container=~".+"} | logfmt | level="info" [10m])) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in logs in {{ $labels.container }}"
          description: "Container has {{ $value }} errors in the last 5 minutes"
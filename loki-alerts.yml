groups:
  - name: loki_alerts
    rules:
      - alert: HighErrorRate
        expr: sum by (container) (count_over_time({container=~".+"} | logfmt | level="error" [10m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Ошибки в логах контейнера {{ $labels.container }}"
          description: "Container has {{ $value }} errors in the last 10 minutes"
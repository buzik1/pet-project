groups:
  - name: loki_alerts
    rules:
      - alert: high_error_rate
        expr: sum by (container) (count_over_time({container=~".+"}| logfmt | level = "error" | msg !~ "executing query" [10m])) > 10
        for: 1m
        labels:
          severity: high
        annotations:
          summary: "Ошибки в логах контейнера {{ $labels.container }}"
          description: "Container has {{ $value }} errors in the last 10 minutes"

      - alert: panic_or_fatal
        expr: sum by (container) (count_over_time({container=~".+"} !~ "(?i)GetRuleGroup unsupported" !~ "(?i)evaluator_local\\.go" !~ "query=.*panic|fatal" |~ "(?i)panic|fatal"[5m])) > 1
        for: 1m
        labels:
          severity: disaster
        annotations:
          summary: "Panic или fatal в логах {{ $labels.container }}"
          description: "Обнаружены критические сообщения panic/fatal в контейнере {{ $labels.container }}. Количество={{ $value }}"

      - alert: status_not_200
        expr: sum by (container) (count_over_time({container=~".+"}| logfmt| status !~ "200|201|204|301|302|304|ok"| status != "" !~ "query=.*status.*"[5m])) > 10
        for: 1m
        labels:
          severity: disaster
        annotations:
          summary: "В логах {{ $labels.container }} обнаружены ошибки, status={{ $labels.status }}"
          description: "Количество={{ $value }}"